name: test
on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      CARGO_NET_RETRY: "5"
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          fetch-depth: 0

      - name: Install Rust toolchain
        run: rustup toolchain install stable --component rustfmt,clippy --profile minimal

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

      - uses: prefix-dev/setup-pixi@d3f436a425481402e6a95a1d1fc10331c708cd9e # v0.10.2
        with:
          run-install: false
          pixi-version: v0.82.1

      - name: Lint
        run: pixi run -e lint lint && git diff --exit-code

      - name: Build
        run: cargo build --all-targets --locked

      - name: Test
        run: pixi run -e test test
