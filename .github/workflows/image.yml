name: image
on:
  push:
    tags: ["pixi-chef@*"]
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to build the image from, e.g. pixi-chef@0.1.0
        required: true
        type: string

concurrency:
  group: image-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

permissions: {}

env:
  IMAGE: ghcr.io/greenroom-robotics/pixi-chef
  TAG: ${{ inputs.tag || github.ref_name }}

jobs:
  binary:
    permissions:
      contents: read
    strategy:
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-latest
            target: x86_64-unknown-linux-musl
          - arch: arm64
            runner: runs-on=${{ github.run_id }}/runner=4cpu-linux-arm64
            target: aarch64-unknown-linux-musl
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: refs/tags/${{ env.TAG }}

      - name: Install musl toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y musl-tools
          rustup toolchain install stable --profile minimal --target ${{ matrix.target }}

      - name: Build static binary
        run: cargo build --release --locked --target ${{ matrix.target }}

      - name: Check binary is statically linked
        run: |
          binary=target/${{ matrix.target }}/release/pixi-chef
          file "$binary" | grep -E "statically linked|static-pie linked"
          if readelf -lW "$binary" | grep -q INTERP; then echo "has interpreter"; exit 1; fi
          if readelf -dW "$binary" | grep -q NEEDED; then echo "has shared deps"; exit 1; fi

      - run: |
          mkdir -p dist/${{ matrix.arch }}
          cp target/${{ matrix.target }}/release/pixi-chef dist/${{ matrix.arch }}/pixi-chef

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: pixi-chef-${{ matrix.arch }}
          path: dist/${{ matrix.arch }}/pixi-chef

  image:
    needs: binary
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: refs/tags/${{ env.TAG }}

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: pixi-chef-*
          path: dist

      - name: Arrange binaries
        run: |
          for arch in amd64 arm64; do
            mv dist/pixi-chef-$arch dist/$arch
            chmod +x dist/$arch/pixi-chef
          done

      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        id: build
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          outputs: type=image,name=${{ env.IMAGE }},push-by-digest=true,name-canonical=true,push=true

      - name: Smoke test COPY --from into bookworm
        run: |
          printf 'FROM debian:bookworm-slim\nCOPY --from=%s@%s /pixi-chef /usr/local/bin/pixi-chef\n' \
            "$IMAGE" "${{ steps.build.outputs.digest }}" > smoke.Dockerfile
          for platform in linux/amd64 linux/arm64; do
            docker buildx build --platform $platform --load -t smoke -f smoke.Dockerfile .
            docker run --rm --platform $platform smoke pixi-chef --help
          done

      - name: Tag verified image with release version
        run: docker buildx imagetools create -t "$IMAGE:${TAG#pixi-chef@}" "$IMAGE@${{ steps.build.outputs.digest }}"
