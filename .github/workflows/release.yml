name: release
on:
  push:
    branches: [main]

concurrency:
  group: release
  cancel-in-progress: false

env:
  IMAGE: ghcr.io/greenroom-robotics/pixi-chef

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          fetch-depth: 0

      - uses: greenroom-robotics/mise/.github/actions/release@v8
        with:
          gh-app-client-id: ${{ secrets.GH_APP_CLIENT_ID }}
          gh-app-private-key: ${{ secrets.GH_APP_PRIVATE_KEY }}
          azure-client-id: ${{ secrets.AZURE_CLIENT_ID }}
          azure-tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          azure-subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
          package-dir: "."
          extra-git-assets: "Cargo.toml Cargo.lock"
          extra-prepare-cmd: "mise ci sync-cargo --package=pixi-chef --version=${nextRelease.version}"

  binary:
    needs: release
    strategy:
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-latest
            target: x86_64-unknown-linux-musl
          - arch: arm64
            runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-musl
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: main

      - name: Install musl toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y musl-tools
          rustup toolchain install stable --profile minimal --target ${{ matrix.target }}

      - name: Build static binary
        run: cargo build --release --locked --target ${{ matrix.target }}

      - name: Check binary is statically linked
        run: |
          binary=target/${{ matrix.target }}/release/pixi-chef
          file "$binary" | grep -E "statically linked|static-pie linked"
          ! ldd "$binary"

      - run: |
          mkdir -p dist/${{ matrix.arch }}
          cp target/${{ matrix.target }}/release/pixi-chef dist/${{ matrix.arch }}/pixi-chef

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: pixi-chef-${{ matrix.arch }}
          path: dist/${{ matrix.arch }}/pixi-chef

  image:
    needs: binary
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: main

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: pixi-chef-*
          path: dist

      - name: Arrange binaries
        run: |
          for arch in amd64 arm64; do
            mv dist/pixi-chef-$arch dist/$arch
            chmod +x dist/$arch/pixi-chef
          done

      - name: Read release version
        id: version
        run: echo "value=$(sed -n '/^\[package\]/,/^\[/{s/^version = "\(.*\)"/\1/p}' pixi.toml)" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Skip when version is already published
        id: published
        run: |
          if docker manifest inspect "$IMAGE:${{ steps.version.outputs.value }}" > /dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        if: steps.published.outputs.exists != 'true'
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ env.IMAGE }}:${{ steps.version.outputs.value }}

      - name: Smoke test COPY --from into bookworm
        if: steps.published.outputs.exists != 'true'
        run: |
          printf 'FROM debian:bookworm-slim\nCOPY --from=%s:%s /pixi-chef /usr/local/bin/pixi-chef\n' \
            "$IMAGE" "${{ steps.version.outputs.value }}" > smoke.Dockerfile
          for platform in linux/amd64 linux/arm64; do
            docker buildx build --platform $platform --load -t smoke -f smoke.Dockerfile .
            docker run --rm --platform $platform smoke pixi-chef --help
          done
