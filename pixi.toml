[workspace]
name = "pixi-chef"
channels = ["https://prefix.dev/conda-forge"]
platforms = ["linux-64", "linux-aarch64"]
preview = ["pixi-build"]

[dependencies]
pixi-chef = { path = "." }

[tasks]
pixi-chef = "pixi-chef"

[feature.lint.tasks]
lint = "cargo fmt --all && cargo clippy --all-targets --all-features --fix --allow-dirty --allow-staged -- -D warnings"

[feature.test.dependencies]
cargo-nextest = ">=0.9.143,<0.10"

[feature.test.tasks]
test = "cargo nextest run --locked --color always && cargo test --doc --locked"

[environments]
lint = { features = ["lint"], no-default-feature = true }
test = { features = ["test"], no-default-feature = true }

[package]
name = "pixi-chef"
version = "1.0.0"
description = "Splits a pixi workspace's container build into a dependency layer and a source layer."

[package.build.backend]
channels = [
  "https://prefix.dev/pixi-build-backends",
  "https://prefix.dev/conda-forge",
]
name = "pixi-build-rust"
version = "*"
