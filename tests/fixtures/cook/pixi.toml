[workspace]
name = "cook"
channels = ["https://prefix.dev/conda-forge"]
platforms = ["linux-64"]
preview = ["pixi-build"]

[dependencies]
tzdata = "*"

[feature.conda.dependencies]
My_App = { path = "app" }

[feature.py.pypi-dependencies]
My_Lib = { path = "lib", editable = true }

[environments]
conda = { features = ["conda"] }
py = { features = ["py"] }

[feature.py.dependencies]
python = ">=3.11"
